name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy
          cp docs/index.html deploy/
          cp docs/404.html deploy/ || true
          cp docs/.nojekyll deploy/ || true
          cp docs/google*.html deploy/ || true
          cp docs/robots.txt deploy/ || true
          cp docs/sitemap.xml deploy/ || true
          cp docs/sitemap-v2.xml deploy/ || true
          cp -r docs/v1 deploy/v1 || true
          cp -r docs/images deploy/images || true
          cp -r docs/documentation deploy/documentation || true
          cp -r docs/videos deploy/videos || true
          cp -r docs/css deploy/css || true
          cp -r docs/js deploy/js || true
          cp docs/accessibility.html deploy/ || true
          cp docs/who-benefits.html deploy/ || true
          cp docs/faq.html deploy/ || true
          cp docs/privacy-policy.html deploy/ || true
          cp docs/releases.html deploy/ || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
