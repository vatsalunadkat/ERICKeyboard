<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=300,height=600">
<title>ERICK — Tremor-friendly typing</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ad{position:relative;width:300px;height:600px;overflow:hidden;text-decoration:none;display:block;
      background:linear-gradient(180deg,#E6D6EF 0%,#C4A8D8 100%);color:#000;padding:26px 24px}
  .brand{font-size:15px;font-weight:800;letter-spacing:2px}
  .dial{width:150px;height:150px;margin:34px auto 26px;border-radius:50%;
      background:conic-gradient(#F4A6B0 0 45deg,#F6C9A0 45deg 90deg,#FDE9A0 90deg 135deg,#A8DFC0 135deg 180deg,#A0C4E8 180deg 225deg,#C4A8D8 225deg 270deg,#D8A8C8 270deg 315deg,#8B8B8B 315deg 360deg);
      box-shadow:0 8px 22px rgba(0,0,0,.2);position:relative;animation:spin 12s linear infinite}
  .dial:after{content:"";position:absolute;inset:46px;background:#fff;border-radius:50%}
  .h{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.6px;opacity:0;animation:up .6s .2s both}
  .s{font-size:15px;font-weight:600;margin-top:10px;opacity:0;animation:up .6s .4s both}
  ul{list-style:none;margin:22px 0 0;padding:0}
  li{font-size:14px;font-weight:700;margin:12px 0;padding-left:26px;position:relative;opacity:0}
  li:before{content:"";position:absolute;left:0;top:3px;width:15px;height:15px;border-radius:50%;background:#000}
  li:nth-child(1){animation:up .5s .6s both}
  li:nth-child(2){animation:up .5s .75s both}
  li:nth-child(3){animation:up .5s .9s both}
  .cta{position:absolute;left:24px;right:24px;bottom:26px;background:#000;color:#fff;text-align:center;
      font-size:15px;font-weight:700;padding:14px 0;border-radius:999px;animation:nudge 2.2s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
</head>
<body>
<script>var clickTag="https://play.google.com/store/apps/details?id=com.vatoo.erick";</script>
<a class="ad" href="javascript:void(0)" onclick="window.open(window.clickTag);return false;" aria-label="ERICK keyboard — tremor-friendly typing. Get it free on Google Play.">
  <span class="brand">ERICK</span>
  <span class="dial"></span>
  <span class="h">Tremor-friendly typing</span>
  <span class="s">Large, steady targets that are easier to control.</span>
  <ul>
    <li>Two big dials, no tiny keys</li>
    <li>Touch or game controller</li>
    <li>100% offline &amp; private</li>
  </ul>
  <span class="cta">Get ERICK free ▸</span>
</a>
</body>
</html>
