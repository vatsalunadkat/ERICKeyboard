<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=250,height=250">
<title>ERICK — 100% offline & private</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ad{position:relative;width:250px;height:250px;overflow:hidden;text-decoration:none;display:block;
      background:linear-gradient(160deg,#ADADAD 0%,#8B8B8B 100%);color:#000;padding:22px 20px;text-align:center}
  .lock{width:54px;height:46px;margin:8px auto 0;position:relative}
  .lock .body{position:absolute;bottom:0;left:0;width:54px;height:34px;background:#000;border-radius:8px}
  .lock .shackle{position:absolute;top:0;left:13px;width:28px;height:30px;border:6px solid #000;
      border-bottom:none;border-radius:16px 16px 0 0;animation:click 2.6s ease-in-out infinite}
  .h{font-size:25px;font-weight:800;line-height:1.05;letter-spacing:-.5px;margin-top:18px;opacity:0;animation:up .6s .2s both}
  .s{font-size:13px;font-weight:600;margin-top:10px;line-height:1.35;opacity:0;animation:up .6s .45s both}
  .cta{position:absolute;left:20px;right:20px;bottom:20px;background:#000;color:#fff;
      font-size:13px;font-weight:700;padding:12px 0;border-radius:999px;animation:nudge 2.2s ease-in-out infinite}
  @keyframes click{0%,100%{transform:translateY(0)}45%{transform:translateY(-5px)}}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
</head>
<body>
<script>var clickTag="https://play.google.com/store/apps/details?id=com.vatoo.erick";</script>
<a class="ad" href="javascript:void(0)" onclick="window.open(window.clickTag);return false;" aria-label="ERICK keyboard — 100% offline and private. Get it free on Google Play.">
  <span class="lock"><span class="shackle"></span><span class="body"></span></span>
  <span class="h">100% offline &amp; private</span>
  <span class="s">No internet permission. Your keystrokes never leave the phone.</span>
  <span class="cta">Get ERICK free ▸</span>
</a>
</body>
</html>
