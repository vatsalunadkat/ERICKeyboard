<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=250,height=250">
<title>ERICK — Works with your controller</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ad{position:relative;width:250px;height:250px;overflow:hidden;text-decoration:none;display:block;
      background:linear-gradient(160deg,#ECD6E4 0%,#D8A8C8 100%);color:#000;padding:22px 20px;text-align:center}
  .pad{position:relative;width:128px;height:78px;margin:10px auto 6px;background:#000;border-radius:24px}
  .stick{position:absolute;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;background:#fff}
  .l{left:17px;animation:ls 2.2s ease-in-out infinite}
  .r{right:17px;animation:rs 2.2s ease-in-out infinite}
  .h{font-size:21px;font-weight:800;line-height:1.05;letter-spacing:-.4px;margin-top:16px;opacity:0;animation:up .6s .3s both}
  .s{font-size:12px;font-weight:600;margin-top:8px;line-height:1.3;opacity:0;animation:up .6s .5s both}
  .cta{position:absolute;left:20px;right:20px;bottom:18px;background:#000;color:#fff;
      font-size:13px;font-weight:700;padding:12px 0;border-radius:999px;animation:nudge 2.2s ease-in-out infinite}
  @keyframes ls{0%,100%{transform:translate(0,0)}45%{transform:translate(-5px,4px)}}
  @keyframes rs{0%,100%{transform:translate(0,0)}45%{transform:translate(5px,-4px)}}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
</head>
<body>
<script>var clickTag="https://play.google.com/store/apps/details?id=com.vatoo.erick";</script>
<a class="ad" href="javascript:void(0)" onclick="window.open(window.clickTag);return false;" aria-label="ERICK — works with your game controller. Type without touching the screen. Free on Google Play.">
  <span class="pad">
    <span class="stick l"></span>
    <span class="stick r"></span>
  </span>
  <span class="h">Works with your controller</span>
  <span class="s">Type without touching the screen at all.</span>
  <span class="cta">Get ERICK free ▸</span>
</a>
</body>
</html>
