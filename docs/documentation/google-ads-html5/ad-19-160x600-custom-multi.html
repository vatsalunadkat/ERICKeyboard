<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=160,height=600">
<title>ERICK — Your keys, your colors</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ad{position:relative;width:160px;height:600px;overflow:hidden;text-decoration:none;display:block;
      background:#fff;color:#000;padding:20px 14px;text-align:center}
  .brand{font-size:14px;font-weight:800;letter-spacing:2px}
  .chips{margin:22px auto 0;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;width:120px}
  .chips i{width:34px;height:34px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.12);
      transform:scale(0);animation:pop .4s both}
  .chips i:nth-child(1){background:#F4A6B0;animation-delay:.15s}
  .chips i:nth-child(2){background:#F6C9A0;animation-delay:.25s}
  .chips i:nth-child(3){background:#FDE9A0;animation-delay:.35s}
  .chips i:nth-child(4){background:#A8DFC0;animation-delay:.45s}
  .chips i:nth-child(5){background:#A0C4E8;animation-delay:.55s}
  .chips i:nth-child(6){background:#C4A8D8;animation-delay:.65s}
  .chips i:nth-child(7){background:#D8A8C8;animation-delay:.75s}
  .chips i:nth-child(8){background:#8B8B8B;animation-delay:.85s}
  .h{font-size:23px;font-weight:800;line-height:1.08;letter-spacing:-.4px;margin-top:28px;opacity:0;animation:up .6s .9s both}
  .s{font-size:12px;font-weight:600;margin-top:12px;line-height:1.35;opacity:0;animation:up .6s 1.05s both}
  .cta{position:absolute;left:14px;right:14px;bottom:20px;background:#000;color:#fff;
      font-size:13px;font-weight:700;padding:13px 0;border-radius:999px;animation:nudge 2.2s ease-in-out infinite}
  @keyframes pop{to{transform:scale(1)}}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
</head>
<body>
<script>var clickTag="https://play.google.com/store/apps/details?id=com.vatoo.erick";</script>
<a class="ad" href="javascript:void(0)" onclick="window.open(window.clickTag);return false;" aria-label="ERICK keyboard — your keys, your colors. Custom palettes, layouts, fonts and themes. Get it free on Google Play.">
  <span class="brand">ERICK</span>
  <span class="chips"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
  <span class="h">Your keys, your colors</span>
  <span class="s">Custom palettes, layouts, themes &amp; dyslexia-friendly fonts.</span>
  <span class="cta">Get it free ▸</span>
</a>
</body>
</html>
