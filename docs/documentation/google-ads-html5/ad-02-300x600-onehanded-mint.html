<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=300,height=600">
<title>ERICK — Made for one hand</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ad{position:relative;width:300px;height:600px;overflow:hidden;text-decoration:none;display:block;
      background:linear-gradient(180deg,#D2EEE0 0%,#A8DFC0 100%);color:#000;padding:30px 26px;text-align:center}
  .brand{font-size:15px;font-weight:800;letter-spacing:2px}
  .dial{width:158px;height:158px;margin:40px auto 30px;border-radius:50%;position:relative;
      background:conic-gradient(#F4A6B0 0 45deg,#F6C9A0 45deg 90deg,#FDE9A0 90deg 135deg,#A8DFC0 135deg 180deg,#A0C4E8 180deg 225deg,#C4A8D8 225deg 270deg,#D8A8C8 270deg 315deg,#8B8B8B 315deg 360deg);
      box-shadow:0 8px 22px rgba(0,0,0,.2)}
  .dial:after{content:"";position:absolute;inset:48px;background:#fff;border-radius:50%}
  .dot{position:absolute;top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
      background:#000;z-index:1;animation:tap 2.6s ease-in-out infinite}
  .h{font-size:31px;font-weight:800;line-height:1.05;letter-spacing:-.6px;opacity:0;animation:up .6s .2s both}
  .s{font-size:15px;font-weight:600;margin-top:12px;opacity:0;animation:up .6s .4s both}
  .cta{position:absolute;left:26px;right:26px;bottom:28px;background:#000;color:#fff;
      font-size:15px;font-weight:700;padding:14px 0;border-radius:999px;animation:nudge 2.4s ease-in-out infinite}
  @keyframes tap{0%,100%{transform:translate(-11px,-11px)}30%{transform:translate(-30px,6px)}60%{transform:translate(10px,-30px)}}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
</head>
<body>
<script>var clickTag="https://play.google.com/store/apps/details?id=com.vatoo.erick";</script>
<a class="ad" href="javascript:void(0)" onclick="window.open(window.clickTag);return false;" aria-label="ERICK — made for one hand. Type with just one hand. Free on Google Play.">
  <span class="brand">ERICK</span>
  <span class="dial"><span class="dot"></span></span>
  <span class="h">Made for one hand</span>
  <span class="s">A simple mode lets one hand do all the typing.</span>
  <span class="cta">Get ERICK free ▸</span>
</a>
</body>
</html>
