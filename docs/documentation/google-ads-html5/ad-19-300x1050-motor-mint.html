<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=300,height=1050">
<title>ERICK — Kinder to tired hands</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ad{position:relative;width:300px;height:1050px;overflow:hidden;text-decoration:none;display:block;
      background:linear-gradient(180deg,#D2EEE0 0%,#A8DFC0 100%);color:#000;padding:42px 30px;text-align:center}
  .brand{font-size:18px;font-weight:800;letter-spacing:2px}
  .dial{width:200px;height:200px;margin:72px auto 40px;border-radius:50%;position:relative;
      background:conic-gradient(#F4A6B0 0 45deg,#F6C9A0 45deg 90deg,#FDE9A0 90deg 135deg,#A8DFC0 135deg 180deg,#A0C4E8 180deg 225deg,#C4A8D8 225deg 270deg,#D8A8C8 270deg 315deg,#8B8B8B 315deg 360deg);
      box-shadow:0 12px 30px rgba(0,0,0,.18);animation:bob 3.6s ease-in-out infinite}
  .dial:after{content:"";position:absolute;inset:62px;background:#fff;border-radius:50%}
  .h{font-size:38px;font-weight:800;line-height:1.05;letter-spacing:-.8px;opacity:0;animation:up .7s .3s both}
  .s{font-size:17px;font-weight:600;margin-top:16px;opacity:0;animation:up .7s .5s both}
  ul{list-style:none;margin:40px 0 0;padding:0;text-align:left;display:inline-block}
  li{font-size:16px;font-weight:700;margin:18px 0;padding-left:32px;position:relative;opacity:0}
  li:before{content:"";position:absolute;left:0;top:3px;width:18px;height:18px;border-radius:50%;background:#000}
  li:nth-child(1){animation:up .5s .7s both}
  li:nth-child(2){animation:up .5s .85s both}
  li:nth-child(3){animation:up .5s 1s both}
  .cta{position:absolute;left:30px;right:30px;bottom:44px;background:#000;color:#fff;
      font-size:18px;font-weight:700;padding:18px 0;border-radius:999px;animation:nudge 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
</head>
<body>
<script>var clickTag="https://play.google.com/store/apps/details?id=com.vatoo.erick";</script>
<a class="ad" href="javascript:void(0)" onclick="window.open(window.clickTag);return false;" aria-label="ERICK — kinder to tired hands. Big targets, less reach, less strain. Free on Google Play.">
  <span class="brand">ERICK</span>
  <span class="dial"></span>
  <span class="h">Kinder to tired hands</span>
  <span class="s">Built for pain, fatigue and motor needs.</span>
  <ul>
    <li>Big, easy targets</li>
    <li>Less reach, less strain</li>
    <li>One-handed mode</li>
  </ul>
  <span class="cta">Get ERICK free ▸</span>
</a>
</body>
</html>
