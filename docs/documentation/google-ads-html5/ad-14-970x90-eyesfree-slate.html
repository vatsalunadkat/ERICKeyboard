<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=970,height=90">
<title>ERICK — Type without looking</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ad{position:relative;width:970px;height:90px;overflow:hidden;text-decoration:none;display:flex;
      align-items:center;background:linear-gradient(90deg,#8B8B8B 0%,#A0C4E8 100%);color:#000}
  .dial{flex:0 0 auto;width:64px;height:64px;margin:0 22px 0 26px;border-radius:50%;
      background:conic-gradient(#F4A6B0 0 45deg,#F6C9A0 45deg 90deg,#FDE9A0 90deg 135deg,#A8DFC0 135deg 180deg,#A0C4E8 180deg 225deg,#C4A8D8 225deg 270deg,#D8A8C8 270deg 315deg,#8B8B8B 315deg 360deg);
      box-shadow:0 4px 12px rgba(0,0,0,.2);position:relative;animation:spin 11s linear infinite}
  .dial:after{content:"";position:absolute;inset:20px;background:#fff;border-radius:50%}
  .txt{flex:1 1 auto;min-width:0}
  .h{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1;opacity:0;animation:in .5s .15s both}
  .s{font-size:15px;font-weight:600;margin-top:6px;opacity:0;animation:in .5s .35s both}
  .cta{flex:0 0 auto;margin:0 26px;background:#000;color:#fff;font-size:15px;font-weight:700;
      padding:13px 22px;border-radius:999px;white-space:nowrap;animation:nudge 2.2s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
</style>
</head>
<body>
<script>var clickTag="https://play.google.com/store/apps/details?id=com.vatoo.erick";</script>
<a class="ad" href="javascript:void(0)" onclick="window.open(window.clickTag);return false;" aria-label="ERICK keyboard — type without looking. Get it free on Google Play.">
  <span class="dial"></span>
  <span class="txt">
    <span class="h">Type without looking</span>
    <span class="s">Predictable directions you can feel — not tiny keys you hunt for.</span>
  </span>
  <span class="cta">Get ERICK free on Google Play ▸</span>
</a>
</body>
</html>
