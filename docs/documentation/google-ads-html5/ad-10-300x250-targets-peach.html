<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=300,height=250">
<title>ERICK — Bigger keys, fewer slips</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ad{position:relative;width:300px;height:250px;overflow:hidden;text-decoration:none;display:block;
      background:linear-gradient(135deg,#FCE6D2 0%,#F6C9A0 100%);color:#000}
  .top{display:flex;align-items:center;height:188px;padding:0 18px}
  .dial{flex:0 0 auto;width:104px;height:104px;border-radius:50%;
      background:conic-gradient(#F4A6B0 0 45deg,#F6C9A0 45deg 90deg,#FDE9A0 90deg 135deg,#A8DFC0 135deg 180deg,#A0C4E8 180deg 225deg,#C4A8D8 225deg 270deg,#D8A8C8 270deg 315deg,#8B8B8B 315deg 360deg);
      box-shadow:0 6px 16px rgba(0,0,0,.18);position:relative;animation:bob 3s ease-in-out infinite}
  .dial:after{content:"";position:absolute;inset:32px;background:#fff;border-radius:50%}
  .dial:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#000;
      top:50%;left:50%;margin:-9px 0 0 -9px;z-index:1;animation:tap 3s ease-in-out infinite}
  .txt{flex:1 1 auto;padding-left:16px}
  .h{font-size:24px;font-weight:800;line-height:1.05;letter-spacing:-.4px;opacity:0;animation:up .6s .2s both}
  .s{font-size:13px;font-weight:600;margin-top:8px;opacity:0;animation:up .6s .45s both}
  .cta{position:absolute;left:0;right:0;bottom:0;height:46px;background:#000;color:#fff;display:flex;
      align-items:center;justify-content:center;font-size:14px;font-weight:700}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes tap{0%,100%{transform:translate(-9px,-9px)}50%{transform:translate(13px,-22px)}}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<script>var clickTag="https://play.google.com/store/apps/details?id=com.vatoo.erick";</script>
<a class="ad" href="javascript:void(0)" onclick="window.open(window.clickTag);return false;" aria-label="ERICK keyboard — bigger keys, fewer slips. Get it free on Google Play.">
  <span class="top">
    <span class="dial"></span>
    <span class="txt">
      <span class="h">Bigger keys, fewer slips</span>
      <span class="s">Two large targets replace a crowded grid.</span>
    </span>
  </span>
  <span class="cta">Get ERICK free on Google Play ▸</span>
</a>
</body>
</html>
