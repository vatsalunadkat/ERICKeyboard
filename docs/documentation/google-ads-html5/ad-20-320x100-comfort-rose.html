<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=320,height=100">
<title>ERICK — Typing made comfortable</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ad{position:relative;width:320px;height:100px;overflow:hidden;text-decoration:none;display:flex;
      align-items:center;background:radial-gradient(120% 140% at 100% 50%,#FBD3D9 0%,#F4A6B0 75%);color:#000}
  .txt{flex:1 1 auto;min-width:0;padding-left:16px}
  .h{font-size:20px;font-weight:800;line-height:1.05;letter-spacing:-.3px;opacity:0;animation:in .5s .15s both}
  .s{font-size:12px;font-weight:600;margin-top:5px;opacity:0;animation:in .5s .35s both}
  .cta{display:inline-block;margin-top:8px;background:#000;color:#fff;font-size:11px;font-weight:700;
      padding:7px 13px;border-radius:999px;opacity:0;animation:in .5s .55s both}
  .dial{flex:0 0 auto;width:72px;height:72px;margin:0 16px;border-radius:50%;
      background:conic-gradient(#F4A6B0 0 45deg,#F6C9A0 45deg 90deg,#FDE9A0 90deg 135deg,#A8DFC0 135deg 180deg,#A0C4E8 180deg 225deg,#C4A8D8 225deg 270deg,#D8A8C8 270deg 315deg,#8B8B8B 315deg 360deg);
      box-shadow:0 5px 12px rgba(0,0,0,.18);position:relative;animation:bob 3s ease-in-out infinite}
  .dial:after{content:"";position:absolute;inset:23px;background:#fff;border-radius:50%}
  @keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
</head>
<body>
<script>var clickTag="https://play.google.com/store/apps/details?id=com.vatoo.erick";</script>
<a class="ad" href="javascript:void(0)" onclick="window.open(window.clickTag);return false;" aria-label="ERICK keyboard — typing made comfortable. Get it free on Google Play.">
  <span class="txt">
    <span class="h">Typing made comfortable</span>
    <span class="s">An inclusive keyboard for real, everyday hands.</span>
    <span class="cta">Get it free on Google Play ▸</span>
  </span>
  <span class="dial"></span>
</a>
</body>
</html>
