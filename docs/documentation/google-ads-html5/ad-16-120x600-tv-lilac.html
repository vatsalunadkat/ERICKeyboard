<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=120,height=600">
<title>ERICK — Couch & TV typing</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ad{position:relative;width:120px;height:600px;overflow:hidden;text-decoration:none;display:block;
      background:linear-gradient(180deg,#ECD6E4 0%,#D8A8C8 100%);color:#000;padding:18px 10px;text-align:center}
  .brand{font-size:12px;font-weight:800;letter-spacing:1.5px}
  .tv{width:84px;height:54px;margin:26px auto 6px;background:#000;border-radius:8px;position:relative}
  .tv:after{content:"";position:absolute;inset:6px;border-radius:4px;
      background:conic-gradient(#F4A6B0 0 90deg,#A8DFC0 90deg 180deg,#A0C4E8 180deg 270deg,#C4A8D8 270deg 360deg);animation:hue 6s linear infinite}
  .stand{width:34px;height:6px;background:#000;margin:0 auto;border-radius:3px}
  .h{font-size:21px;font-weight:800;line-height:1.05;letter-spacing:-.4px;margin-top:24px;opacity:0;animation:up .6s .2s both}
  .s{font-size:11px;font-weight:600;margin-top:12px;line-height:1.35;opacity:0;animation:up .6s .45s both}
  .cta{position:absolute;left:10px;right:10px;bottom:18px;background:#000;color:#fff;
      font-size:12px;font-weight:700;padding:12px 0;border-radius:999px;animation:nudge 2.2s ease-in-out infinite}
  @keyframes hue{to{filter:hue-rotate(360deg)}}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
</head>
<body>
<script>var clickTag="https://play.google.com/store/apps/details?id=com.vatoo.erick";</script>
<a class="ad" href="javascript:void(0)" onclick="window.open(window.clickTag);return false;" aria-label="ERICK keyboard — type from the couch on TVs and consoles. Get it free on Google Play.">
  <span class="brand">ERICK</span>
  <span class="tv"></span>
  <span class="stand"></span>
  <span class="h">Type from the couch</span>
  <span class="s">Controller typing for TVs, consoles &amp; set-top boxes.</span>
  <span class="cta">Get free ▸</span>
</a>
</body>
</html>
