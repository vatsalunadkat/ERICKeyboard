<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=200,height=200">
<title>ERICK — Stays on your phone</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ad{position:relative;width:200px;height:200px;overflow:hidden;text-decoration:none;display:block;
      background:linear-gradient(160deg,#ADADAD 0%,#8B8B8B 100%);color:#000;padding:18px 16px;text-align:center}
  .lock{width:42px;height:36px;margin:6px auto 0;position:relative}
  .lock .body{position:absolute;bottom:0;left:0;width:42px;height:26px;background:#000;border-radius:6px}
  .lock .shackle{position:absolute;top:0;left:10px;width:22px;height:24px;border:5px solid #000;
      border-bottom:none;border-radius:13px 13px 0 0;animation:click 2.6s ease-in-out infinite}
  .h{font-size:19px;font-weight:800;line-height:1.05;letter-spacing:-.3px;margin-top:14px;opacity:0;animation:up .5s .3s both}
  .s{font-size:11px;font-weight:600;margin-top:8px;line-height:1.3;opacity:0;animation:up .5s .5s both}
  .cta{position:absolute;left:16px;right:16px;bottom:16px;background:#000;color:#fff;
      font-size:11px;font-weight:700;padding:10px 0;border-radius:999px;animation:nudge 2.2s ease-in-out infinite}
  @keyframes click{0%,100%{transform:translateY(0)}45%{transform:translateY(-4px)}}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
</style>
</head>
<body>
<script>var clickTag="https://play.google.com/store/apps/details?id=com.vatoo.erick";</script>
<a class="ad" href="javascript:void(0)" onclick="window.open(window.clickTag);return false;" aria-label="ERICK — your typing stays on your phone. Free on Google Play.">
  <span class="lock"><span class="shackle"></span><span class="body"></span></span>
  <span class="h">Stays on your phone</span>
  <span class="s">Your typing never leaves your device.</span>
  <span class="cta">Get it free ▸</span>
</a>
</body>
</html>
