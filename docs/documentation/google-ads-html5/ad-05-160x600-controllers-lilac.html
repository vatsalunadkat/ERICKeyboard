<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=160,height=600">
<title>ERICK — Type with any controller</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ad{position:relative;width:160px;height:600px;overflow:hidden;text-decoration:none;display:block;
      background:linear-gradient(180deg,#ECD6E4 0%,#D8A8C8 100%);color:#000;padding:22px 16px;text-align:center}
  .brand{font-size:14px;font-weight:800;letter-spacing:2px}
  .pad{position:relative;width:124px;height:76px;margin:30px auto 28px;background:#000;border-radius:24px}
  .stick{position:absolute;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;background:#fff}
  .l{left:16px;animation:ls 2.2s ease-in-out infinite}
  .r{right:16px;animation:rs 2.2s ease-in-out infinite}
  .h{font-size:22px;font-weight:800;line-height:1.08;letter-spacing:-.4px;opacity:0;animation:up .6s .2s both}
  .s{font-size:13px;font-weight:600;margin-top:12px;line-height:1.35;opacity:0;animation:up .6s .45s both}
  .cta{position:absolute;left:16px;right:16px;bottom:22px;background:#000;color:#fff;
      font-size:13px;font-weight:700;padding:13px 0;border-radius:999px;animation:nudge 2.2s ease-in-out infinite}
  @keyframes ls{0%,100%{transform:translate(0,0)}45%{transform:translate(-5px,4px)}}
  @keyframes rs{0%,100%{transform:translate(0,0)}45%{transform:translate(5px,-4px)}}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
</head>
<body>
<script>var clickTag="https://play.google.com/store/apps/details?id=com.vatoo.erick";</script>
<a class="ad" href="javascript:void(0)" onclick="window.open(window.clickTag);return false;" aria-label="ERICK — type with any game controller. Xbox, PlayStation, 8BitDo and more. Free on Google Play.">
  <span class="brand">ERICK</span>
  <span class="pad">
    <span class="stick l"></span>
    <span class="stick r"></span>
  </span>
  <span class="h">Type with any controller</span>
  <span class="s">Xbox, PlayStation, 8BitDo and more. Or just use touch.</span>
  <span class="cta">Get it free ▸</span>
</a>
</body>
</html>
