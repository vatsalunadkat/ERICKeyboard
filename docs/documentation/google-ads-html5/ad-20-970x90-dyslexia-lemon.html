<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=970,height=90">
<title>ERICK — Colors and fonts that help</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ad{position:relative;width:970px;height:90px;overflow:hidden;text-decoration:none;display:flex;
      align-items:center;background:linear-gradient(90deg,#FEF3C8 0%,#FDE9A0 100%);color:#000}
  .chips{flex:0 0 auto;display:flex;gap:8px;margin:0 24px 0 28px}
  .chips i{width:30px;height:30px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.16);transform:scale(0);animation:pop .4s both}
  .chips i:nth-child(1){background:#F4A6B0;animation-delay:.1s}
  .chips i:nth-child(2){background:#A8DFC0;animation-delay:.2s}
  .chips i:nth-child(3){background:#A0C4E8;animation-delay:.3s}
  .chips i:nth-child(4){background:#C4A8D8;animation-delay:.4s}
  .txt{flex:1 1 auto;min-width:0}
  .h{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1;opacity:0;animation:in .5s .2s both}
  .s{font-size:15px;font-weight:600;margin-top:6px;opacity:0;animation:in .5s .4s both}
  .cta{flex:0 0 auto;margin:0 26px;background:#000;color:#fff;font-size:15px;font-weight:700;
      padding:13px 22px;border-radius:999px;white-space:nowrap;animation:nudge 2.2s ease-in-out infinite}
  @keyframes pop{to{transform:scale(1)}}
  @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
</style>
</head>
<body>
<script>var clickTag="https://play.google.com/store/apps/details?id=com.vatoo.erick";</script>
<a class="ad" href="javascript:void(0)" onclick="window.open(window.clickTag);return false;" aria-label="ERICK — colors and fonts that help. Colorblind-safe colors and dyslexia-friendly fonts. Free on Google Play.">
  <span class="chips"><i></i><i></i><i></i><i></i></span>
  <span class="txt">
    <span class="h">Colors and fonts that help</span>
    <span class="s">Colorblind-safe colors and dyslexia-friendly fonts.</span>
  </span>
  <span class="cta">Get ERICK free ▸</span>
</a>
</body>
</html>
