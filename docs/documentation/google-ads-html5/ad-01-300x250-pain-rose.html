<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=300,height=250">
<title>ERICK — Typing shouldn't hurt</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ad{position:relative;width:300px;height:250px;overflow:hidden;text-decoration:none;display:block;
      background:radial-gradient(120% 120% at 50% 0%,#FBD3D9 0%,#F4A6B0 70%);color:#000}
  .dial{position:absolute;top:24px;left:50%;width:96px;height:96px;margin-left:-48px;border-radius:50%;
      background:conic-gradient(#F4A6B0 0 45deg,#F6C9A0 45deg 90deg,#FDE9A0 90deg 135deg,#A8DFC0 135deg 180deg,#A0C4E8 180deg 225deg,#C4A8D8 225deg 270deg,#D8A8C8 270deg 315deg,#8B8B8B 315deg 360deg);
      box-shadow:0 6px 16px rgba(0,0,0,.18);animation:spin 9s linear infinite}
  .dial:after{content:"";position:absolute;inset:30px;background:#fff;border-radius:50%}
  .pulse{position:absolute;top:24px;left:50%;width:96px;height:96px;margin-left:-48px;border-radius:50%;
      border:3px solid rgba(0,0,0,.25);animation:pulse 2.2s ease-out infinite}
  .copy{position:absolute;left:0;right:0;top:138px;text-align:center;padding:0 16px}
  .h{font-size:24px;font-weight:800;line-height:1.05;letter-spacing:-.4px;opacity:0;animation:up .6s .2s both}
  .s{font-size:13px;font-weight:600;margin-top:6px;opacity:0;animation:up .6s .45s both}
  .cta{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#000;color:#fff;
      font-size:12px;font-weight:700;padding:9px 16px;border-radius:999px;opacity:0;animation:up .6s .7s both}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.45);opacity:0}}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<script>var clickTag="https://play.google.com/store/apps/details?id=com.vatoo.erick";</script>
<a class="ad" href="javascript:void(0)" onclick="window.open(window.clickTag);return false;" aria-label="ERICK keyboard — typing shouldn't hurt. Get it free on Google Play.">
  <span class="dial"></span>
  <span class="pulse"></span>
  <span class="copy">
    <span class="h">Typing shouldn't&nbsp;hurt</span>
    <span class="s">Big targets. Less reach. Fewer painful taps.</span>
  </span>
  <span class="cta">Get ERICK free ▸</span>
</a>
</body>
</html>
