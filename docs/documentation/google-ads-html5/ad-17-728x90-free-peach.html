<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=728,height=90">
<title>ERICK — Free on Google Play</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ad{position:relative;width:728px;height:90px;overflow:hidden;text-decoration:none;display:flex;
      align-items:center;background:linear-gradient(90deg,#F6C9A0 0%,#FBE0C6 100%);color:#000}
  .dial{flex:0 0 auto;width:60px;height:60px;margin:0 18px 0 24px;border-radius:50%;
      background:conic-gradient(#F4A6B0 0 45deg,#F6C9A0 45deg 90deg,#FDE9A0 90deg 135deg,#A8DFC0 135deg 180deg,#A0C4E8 180deg 225deg,#C4A8D8 225deg 270deg,#D8A8C8 270deg 315deg,#8B8B8B 315deg 360deg);
      box-shadow:0 3px 9px rgba(0,0,0,.18);position:relative;animation:spin 10s linear infinite}
  .dial:after{content:"";position:absolute;inset:19px;background:#fff;border-radius:50%}
  .txt{flex:1 1 auto;min-width:0}
  .h{font-size:27px;font-weight:800;letter-spacing:-.5px;line-height:1;opacity:0;animation:in .5s .15s both}
  .s{font-size:14px;font-weight:600;margin-top:6px;opacity:0;animation:in .5s .35s both}
  .cta{flex:0 0 auto;margin:0 24px;background:#000;color:#fff;font-size:15px;font-weight:700;
      padding:13px 24px;border-radius:999px;white-space:nowrap;animation:pulse 1.8s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
</style>
</head>
<body>
<script>var clickTag="https://play.google.com/store/apps/details?id=com.vatoo.erick";</script>
<a class="ad" href="javascript:void(0)" onclick="window.open(window.clickTag);return false;" aria-label="ERICK keyboard — free on Google Play, no ads, no tracking. Get it now.">
  <span class="dial"></span>
  <span class="txt">
    <span class="h">Free on Google Play</span>
    <span class="s">The accessibility-first keyboard. No ads in the keyboard. No tracking.</span>
  </span>
  <span class="cta">Install ERICK ▸</span>
</a>
</body>
</html>
