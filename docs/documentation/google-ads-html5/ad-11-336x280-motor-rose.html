<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=336,height=280">
<title>ERICK — Gentle on sore hands</title>
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ad{position:relative;width:336px;height:280px;overflow:hidden;text-decoration:none;display:block;
      background:radial-gradient(120% 120% at 50% 0%,#FBD3D9 0%,#F4A6B0 72%);color:#000}
  .dial{position:absolute;top:30px;left:50%;width:100px;height:100px;margin-left:-50px;border-radius:50%;
      background:conic-gradient(#F4A6B0 0 45deg,#F6C9A0 45deg 90deg,#FDE9A0 90deg 135deg,#A8DFC0 135deg 180deg,#A0C4E8 180deg 225deg,#C4A8D8 225deg 270deg,#D8A8C8 270deg 315deg,#8B8B8B 315deg 360deg);
      box-shadow:0 6px 16px rgba(0,0,0,.18);animation:bob 3.4s ease-in-out infinite}
  .dial:after{content:"";position:absolute;inset:31px;background:#fff;border-radius:50%}
  .pulse{position:absolute;top:30px;left:50%;width:100px;height:100px;margin-left:-50px;border-radius:50%;
      border:3px solid rgba(0,0,0,.22);animation:pulse 2.4s ease-out infinite}
  .copy{position:absolute;left:0;right:0;top:150px;text-align:center;padding:0 20px}
  .h{font-size:27px;font-weight:800;line-height:1.05;letter-spacing:-.5px;opacity:0;animation:up .6s .2s both}
  .s{font-size:14px;font-weight:600;margin-top:8px;opacity:0;animation:up .6s .45s both}
  .cta{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#000;color:#fff;
      font-size:13px;font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;animation:up .6s .7s both}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.4);opacity:0}}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<script>var clickTag="https://play.google.com/store/apps/details?id=com.vatoo.erick";</script>
<a class="ad" href="javascript:void(0)" onclick="window.open(window.clickTag);return false;" aria-label="ERICK — gentle on sore hands. Less reach, less effort. Free on Google Play.">
  <span class="dial"></span>
  <span class="pulse"></span>
  <span class="copy">
    <span class="h">Gentle on sore hands</span>
    <span class="s">Less reach and less effort for pain and fatigue.</span>
  </span>
  <span class="cta">Get ERICK free ▸</span>
</a>
</body>
</html>
